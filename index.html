<style>
  :root{
    --paper:#F2ECDC;
    --paper-line:#DCD2B4;
    --ink:#26324A;
    --ink-soft:#5B6478;
    --hanko:#B7401F;
    --hanko-dark:#8E2F16;
    --gold:#C89A2E;
    --gold-light:#E9CE85;
    --green:#4B7F52;
    --blue:#2E6F9E;
    --blue-light:#6FA8CC;
    --paper-shadow: rgba(38,50,74,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans JP', sans-serif;
    background:
      radial-gradient(ellipse at top, #FBF7EA 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  .num{font-family:'JetBrains Mono', monospace;}

  /* ---------- Header ---------- */
  header{
    padding:22px 18px 14px;
    text-align:center;
    position:relative;
  }
  header .cover-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:0.08em;
    color:var(--ink);
    display:inline-block;
    position:relative;
  }
  header .cover-title::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-8deg);
    width:78px;height:78px;
    border:2.5px solid var(--hanko);
    border-radius:50%;
    opacity:0.16;
    pointer-events:none;
  }
  header .sub{
    margin-top:4px;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.12em;
  }
  header .holder-name{
    margin-top:14px;
    display:inline-flex;
    align-items:baseline;
    gap:8px;
    padding:6px 18px;
    border-top:1px solid var(--paper-line);
    border-bottom:1px solid var(--paper-line);
  }
  header .holder-name .hn-label{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.1em;
  }
  header .holder-name .hn-value{
    font-family:'Shippori Mincho', serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:0.05em;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    padding:0 14px;
    margin:14px auto 0;
    max-width:480px;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1;
    white-space:nowrap;
    border:none;
    background:transparent;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    padding:10px 6px 12px;
    border-bottom:3px solid transparent;
    cursor:pointer;
    transition:color .2s, border-color .2s;
  }
  nav.tabs button.active{
    color:var(--hanko);
    border-color:var(--hanko);
  }

  main{
    max-width:480px;
    margin:0 auto;
    padding:18px 16px 0;
  }
  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .card{
    background:#FBF8EE;
    border:1px solid var(--paper-line);
    border-radius:10px;
    box-shadow:0 2px 0 var(--paper-shadow);
    padding:16px;
    margin-bottom:16px;
  }
  .card h2{
    font-family:'Shippori Mincho', serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 12px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2::before{
    content:"";
    width:6px;height:6px;
    background:var(--hanko);
    border-radius:50%;
    display:inline-block;
  }

  /* ---------- Chore grid (record tab) ---------- */
  .chore-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .chore-btn{
    background:#FFFDF6;
    border:1.5px solid var(--paper-line);
    border-radius:10px;
    padding:14px 10px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .chore-btn:active{transform:scale(0.96);}
  .chore-btn:hover{border-color:var(--gold);}
  .chore-btn .cname{
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    display:block;
    margin-bottom:6px;
    line-height:1.3;
  }
  .chore-btn .cprice{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:15px;
    color:var(--hanko);
  }
  .chore-btn .cprice::before{content:"¥";font-size:12px;margin-right:1px;}
  .empty-note{
    color:var(--ink-soft);
    font-size:13px;
    text-align:center;
    padding:18px 6px;
  }

  .date-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .date-row input[type=date]{
    font-family:'JetBrains Mono', monospace;
    border:1px solid var(--paper-line);
    background:#FFFDF6;
    border-radius:6px;
    padding:6px 8px;
    color:var(--ink);
    font-size:13px;
  }

  /* ---------- Ledger (passbook lines) ---------- */
  .ledger{
    background:
      repeating-linear-gradient(
        to bottom,
        transparent, transparent 39px,
        var(--paper-line) 39px, var(--paper-line) 40px
      );
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:0 14px;
    margin-bottom:16px;
  }
  .ledger-row{
    display:flex;
    align-items:center;
    height:40px;
    font-size:13px;
    gap:8px;
  }
  .ledger-row .lr-date{
    font-family:'JetBrains Mono', monospace;
    color:var(--ink-soft);
    width:66px;
    flex-shrink:0;
    font-size:12px;
  }
  .ledger-row .lr-name{
    flex:1;
    color:var(--ink);
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .ledger-row .lr-amt{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--green);
    flex-shrink:0;
  }
  .ledger-row .lr-amt::before{content:"+¥";font-weight:500;font-size:11px;}
  .ledger-row .lr-del{
    background:none;border:none;color:var(--ink-soft);
    font-size:15px; cursor:pointer; flex-shrink:0; padding:0 2px;
    opacity:0.5;
  }
  .ledger-row .lr-del:hover{opacity:1; color:var(--hanko);}
  .ledger-empty{
    padding:18px 4px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }

  /* ---------- Total / settle card ---------- */
  .total-card{
    background:linear-gradient(160deg, #FBF8EE 0%, #F5EED8 100%);
    border:1.5px solid var(--gold-light);
    border-radius:12px;
    padding:20px;
    text-align:center;
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
  }
  .total-card .stamp-ring{
    position:absolute;
    top:-30px; right:-30px;
    width:110px;height:110px;
    border:3px solid var(--hanko);
    border-radius:50%;
    opacity:0.08;
    transform:rotate(-12deg);
  }
  .total-card .label{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.1em;
    margin-bottom:6px;
  }
  .total-card .amount{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:38px;
    color:var(--ink);
  }
  .total-card .amount::before{content:"¥";font-size:22px;color:var(--gold);margin-right:3px;}
  .settle-btn{
    display:block;
    width:100%;
    margin-top:16px;
    background:var(--hanko);
    color:#FBF3E6;
    border:none;
    border-radius:8px;
    padding:13px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:background .15s, transform .12s;
  }
  .settle-btn:active{transform:scale(0.98);}
  .settle-btn:disabled{
    background:#C9C2AC;
    cursor:not-allowed;
  }
  .settle-btn:not(:disabled):hover{background:var(--hanko-dark);}

  /* ---------- Chart ---------- */
  canvas#chart{
    width:100%;
    display:block;
  }
  .chart-legend{
    display:flex;
    gap:16px;
    margin-bottom:8px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .chart-legend .lg-item{display:flex; align-items:center; gap:5px;}
  .chart-legend .lg-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .chart-legend .lg-earn{background:linear-gradient(135deg, var(--hanko), var(--gold));}
  .chart-legend .lg-pay{background:linear-gradient(135deg, var(--blue), var(--blue-light));}

  /* ---------- Items (chore settings) ---------- */
  .name-input-row input[type=text]{
    width:100%;
    border:1px solid var(--paper-line);
    background:#FFFDF6;
    border-radius:8px;
    padding:11px 12px;
    font-size:15px;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
  }
  .name-input-row input[type=text]:focus{
    outline:none;
    border-color:var(--gold);
  }

  .item-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 0;
    border-bottom:1px dashed var(--paper-line);
  }
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=text]{
    flex:1;
    min-width:0;
    border:1px solid var(--paper-line);
    background:#FFFDF6;
    border-radius:6px;
    padding:8px 9px;
    font-size:13px;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
  }
  .item-row input[type=number]{
    width:76px;
    border:1px solid var(--paper-line);
    background:#FFFDF6;
    border-radius:6px;
    padding:8px 6px;
    font-size:13px;
    font-family:'JetBrains Mono', monospace;
    color:var(--ink);
    text-align:right;
  }
  .item-row .yen-sign{font-size:12px;color:var(--ink-soft);}
  .item-row .del-item{
    background:none;border:none;color:var(--ink-soft);
    font-size:17px;cursor:pointer;opacity:0.55;padding:2px 4px;
  }
  .item-row .del-item:hover{opacity:1;color:var(--hanko);}
  .add-item-btn{
    width:100%;
    margin-top:10px;
    background:transparent;
    border:1.5px dashed var(--gold);
    color:var(--hanko-dark);
    border-radius:8px;
    padding:10px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .add-item-btn:hover{background:rgba(200,154,46,0.08);}

  .danger-card{border-color:rgba(183,64,31,0.35);}
  .danger-note{
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 12px;
  }
  .danger-btn{
    width:100%;
    background:transparent;
    border:1.5px solid var(--hanko);
    color:var(--hanko);
    border-radius:8px;
    padding:11px;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .danger-btn:hover{background:rgba(183,64,31,0.08);}
  .modal-btns .danger-confirm{background:var(--hanko); color:#FBF3E6;}
  .modal-btns .danger-confirm:hover{background:var(--hanko-dark);}

  /* ---------- History ---------- */
  .hist-item{
    border:1px solid var(--paper-line);
    border-radius:9px;
    margin-bottom:10px;
    overflow:hidden;
    background:#FFFDF6;
  }
  .hist-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    cursor:pointer;
  }
  .hist-head .hd-date{
    font-size:13px;
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
  }
  .hist-head .hd-amt{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    color:var(--hanko);
  }
  .hist-head .hd-amt::before{content:"¥";font-size:12px;color:var(--gold);}
  .hist-body{
    display:none;
    padding:0 14px 12px;
    border-top:1px dashed var(--paper-line);
  }
  .hist-body.open{display:block;}
  .hist-body .hb-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--ink-soft);
    padding:6px 0;
  }
  .hist-body .hb-carry{
    font-size:12px;
    color:var(--blue);
    padding:8px 0 4px;
    border-bottom:1px dashed var(--paper-line);
    margin-bottom:2px;
  }

  /* ---------- Stamp animation ---------- */
  .stamp-fx{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.4) rotate(-14deg);
    width:130px;height:130px;
    border:5px solid var(--hanko);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--hanko);
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:22px;
    opacity:0;
    pointer-events:none;
    z-index:999;
  }
  .stamp-fx.play{
    animation:stampPlay .55s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @keyframes stampPlay{
    0%{opacity:0; transform:translate(-50%,-50%) scale(2.2) rotate(-14deg);}
    35%{opacity:0.9; transform:translate(-50%,-50%) scale(0.92) rotate(-14deg);}
    50%{opacity:0.9; transform:translate(-50%,-50%) scale(1.05) rotate(-14deg);}
    75%{opacity:0.8; transform:translate(-50%,-50%) scale(1) rotate(-14deg);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1) rotate(-14deg);}
  }

  /* ---------- Modal ---------- */
  .modal-bg{
    position:fixed; inset:0;
    background:rgba(38,50,74,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:200;
    padding:20px;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--paper);
    border-radius:14px;
    padding:22px;
    max-width:340px;
    width:100%;
    box-shadow:0 12px 30px rgba(38,50,74,0.3);
  }
  .modal h3{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    margin:0 0 10px;
    color:var(--ink);
  }
  .modal p{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 18px;
  }
  .modal .modal-total{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:26px;
    color:var(--hanko);
    margin-bottom:18px;
  }
  .modal .modal-total::before{content:"¥";font-size:15px;color:var(--gold);}
  .settle-input-row{
    display:flex;
    align-items:center;
    gap:6px;
    background:#FFFDF6;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:8px;
  }
  .settle-input-row .yen-sign{font-size:15px; color:var(--ink-soft); font-weight:700;}
  .settle-input-row input[type=number]{
    flex:1;
    border:none;
    background:transparent;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    min-width:0;
  }
  .settle-input-row input[type=number]:focus{outline:none;}
  .settle-input-row.input-error{border-color:var(--hanko);}
  #settleAmountInput.input-error{color:var(--hanko);}
  .settle-remain{
    font-size:12px;
    color:var(--blue);
    min-height:16px;
    margin-bottom:14px;
  }
  .settle-remain.is-error{color:var(--hanko); font-weight:700;}
  .modal-btns .confirm:disabled{
    background:#C9C2AC;
    cursor:not-allowed;
  }
  .modal-btns{display:flex; gap:10px;}
  .modal-btns button{
    flex:1;
    padding:11px;
    border-radius:8px;
    border:none;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .modal-btns .cancel{background:#E7E0CB; color:var(--ink);}
  .modal-btns .confirm{background:var(--hanko); color:#FBF3E6;}

  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#FBF3E6;
    padding:11px 20px;
    border-radius:20px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    transition:opacity .25s, transform .25s;
    z-index:300;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <div class="cover-title">おてつだい通帳</div>
  <div class="sub">OTETSUDAI PASSBOOK</div>
  <div class="holder-name" id="holderNameRow" style="display:none;">
    <span class="hn-label">名前</span>
    <span class="hn-value" id="holderNameValue"></span>
  </div>
</header>

<nav class="tabs">
  <button data-tab="record" class="active">きろく</button>
  <button data-tab="graph">グラフ</button>
  <button data-tab="items">こうもく</button>
  <button data-tab="history">せいさん履歴</button>
</nav>

<main id="main">
  <div class="loading" id="loading">よみこみちゅう…</div>
</main>

<div class="stamp-fx" id="stampFx">済</div>

<div class="modal-bg" id="settleModalBg">
  <div class="modal">
    <h3>せいさんする金額</h3>
    <p>今たまっている金額は下の通りです。支払う金額を入力してください。全部より少ない金額を入れると、残りは次回にくり越されます。</p>
    <div class="modal-total num" id="settleModalTotal">0</div>
    <div class="settle-input-row">
      <span class="yen-sign">¥</span>
      <input type="number" id="settleAmountInput" min="0" step="10">
    </div>
    <div class="settle-remain" id="settleRemainNote"></div>
    <div class="modal-btns">
      <button class="cancel" id="settleCancel">やめる</button>
      <button class="confirm" id="settleConfirm">せいさんする</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="resetModalBg">
  <div class="modal">
    <h3>本当に削除しますか？</h3>
    <p>きろく（未精算のおてつだい記録）と、せいさん履歴のすべてを削除します。おてつだいこうもく（項目や金額の設定）は残ります。この操作はもとに戻せません。</p>
    <div class="modal-btns">
      <button class="cancel" id="resetCancel">やめる</button>
      <button class="confirm danger-confirm" id="resetConfirm">削除する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------- Storage helpers (with graceful fallback) ----------------
  // Tries window.storage first (persists across devices/sessions when available).
  // If that's not working in this environment, falls back to localStorage
  // (persists in this browser only), and finally to an in-memory store
  // (persists for this viewing session only). Fails silently to the next
  // tier rather than surfacing raw errors to the user.
  let storageMode = (typeof window.storage !== 'undefined') ? 'window' : 'local';
  const memoryDB = {};
  let fallbackNoticeShown = false;

  function localStorageWorks(){
    try{
      localStorage.setItem('__otetsudai_test__','1');
      localStorage.removeItem('__otetsudai_test__');
      return true;
    }catch(e){ return false; }
  }

  function demoteStorageMode(){
    if(storageMode === 'window'){
      storageMode = localStorageWorks() ? 'local' : 'memory';
    } else if(storageMode === 'local'){
      storageMode = 'memory';
    }
    if(!fallbackNoticeShown){
      fallbackNoticeShown = true;
      showToast(storageMode === 'local'
        ? 'この端末（ブラウザ）に保存します'
        : '今の画面を開いている間だけ保存されます');
    }
  }

  async function loadData(key, fallback){
    if(storageMode === 'window'){
      try{
        const res = await window.storage.get(key, false);
        return (res && res.value) ? JSON.parse(res.value) : fallback;
      }catch(e){
        return fallback; // missing key or unavailable — treat as "no data yet"
      }
    }
    if(storageMode === 'local'){
      try{
        const v = localStorage.getItem('otetsudai_'+key);
        return v ? JSON.parse(v) : fallback;
      }catch(e){ return fallback; }
    }
    return (memoryDB[key] !== undefined) ? memoryDB[key] : fallback;
  }

  async function saveData(key, value){
    if(storageMode === 'window'){
      try{
        const result = await window.storage.set(key, JSON.stringify(value), false);
        if(!result) throw new Error('no result from window.storage.set');
        return;
      }catch(e){
        demoteStorageMode();
        return saveData(key, value); // retry once with the new mode
      }
    }
    if(storageMode === 'local'){
      try{
        localStorage.setItem('otetsudai_'+key, JSON.stringify(value));
        return;
      }catch(e){
        demoteStorageMode();
        return saveData(key, value);
      }
    }
    memoryDB[key] = value;
  }

  // ---------------- State ----------------
  let chores = [];      // {id, name, price}
  let entries = [];      // {id, choreId, choreName, price, date} unsettled
  let settlements = [];  // {id, date, total, entries:[{choreName, price, date}]}
  let childName = '';

  // Safety net: keep unexpected async errors from surfacing as a scary
  // full-screen error overlay — log quietly instead so the app stays usable.
  window.addEventListener('unhandledrejection', function(ev){
    console.warn('未処理のエラー:', ev.reason);
    ev.preventDefault();
  });

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtDateShort(iso){
    const [y,m,d] = iso.split('-');
    return `${m}/${d}`;
  }
  function fmtDateFull(iso){
    const [y,m,d] = iso.split('-');
    return `${y}年${m}月${d}日`;
  }

  // ---------------- Init ----------------
  const DEFAULT_CHORES = [
    {id: uid(), name:'皿洗い', price:100},
    {id: uid(), name:'靴磨き', price:150},
    {id: uid(), name:'お風呂そうじ', price:150},
    {id: uid(), name:'ゴミ出し', price:50},
  ];

  async function init(){
    chores = await loadData('chores', DEFAULT_CHORES);
    entries = await loadData('entries', []);
    settlements = await loadData('settlements', []);
    childName = await loadData('childName', '');
    document.getElementById('loading').remove();
    buildAllPanels();
    switchTab('record');
  }

  function renderHolderName(){
    const row = document.getElementById('holderNameRow');
    const val = document.getElementById('holderNameValue');
    if(childName){
      val.textContent = childName;
      row.style.display = 'inline-flex';
    } else {
      row.style.display = 'none';
    }
  }

  // ---------------- Tabs ----------------
  const tabButtons = document.querySelectorAll('nav.tabs button');
  tabButtons.forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });
  function switchTab(name){
    tabButtons.forEach(b=> b.classList.toggle('active', b.dataset.tab===name));
    document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.id==='panel-'+name));
    if(name==='graph') drawChart();
  }

  // ---------------- Build panels (static shells) ----------------
  function buildAllPanels(){
    const main = document.getElementById('main');
    main.innerHTML = `
      <div class="panel active" id="panel-record">
        <div class="card">
          <h2>おてつだいをえらぶ</h2>
          <div class="date-row">
            <span>日付</span>
            <input type="date" id="entryDate">
          </div>
          <div class="chore-grid" id="choreGrid"></div>
        </div>
        <div class="card">
          <h2>きろく（未精算）</h2>
          <div class="ledger" id="ledgerList"></div>
        </div>
      </div>

      <div class="panel" id="panel-graph">
        <div class="total-card">
          <div class="stamp-ring"></div>
          <div class="label">今たまっている金額</div>
          <div class="amount num" id="graphTotal">0</div>
          <button class="settle-btn" id="settleBtn">せいさんする（お支払い）</button>
        </div>
        <div class="card">
          <h2>日別のきろく</h2>
          <div class="chart-legend">
            <span class="lg-item"><span class="lg-dot lg-earn"></span>かせいだ額</span>
            <span class="lg-item"><span class="lg-dot lg-pay"></span>せいさん（お支払い）額</span>
          </div>
          <canvas id="chart" height="200"></canvas>
        </div>
      </div>

      <div class="panel" id="panel-items">
        <div class="card">
          <h2>お子さんの名前</h2>
          <div class="name-input-row">
            <input type="text" id="childNameInput" placeholder="例：太郎" maxlength="20">
          </div>
        </div>
        <div class="card">
          <h2>おてつだいこうもく</h2>
          <div id="itemsList"></div>
          <button class="add-item-btn" id="addItemBtn">＋ こうもくをついか</button>
        </div>
        <div class="card danger-card">
          <h2>データの管理</h2>
          <p class="danger-note">きろくとせいさん履歴をすべて削除します。おてつだいこうもく（項目と金額の設定）は消えません。この操作はもとに戻せません。</p>
          <button class="danger-btn" id="resetDataBtn">きろく・せいさん履歴をすべて削除</button>
        </div>
      </div>

      <div class="panel" id="panel-history">
        <div class="card">
          <h2>せいさん履歴</h2>
          <div id="historyList"></div>
        </div>
      </div>
    `;
    document.getElementById('entryDate').value = todayStr();
    document.getElementById('entryDate').max = todayStr();
    document.getElementById('addItemBtn').addEventListener('click', addNewItemRow);
    document.getElementById('settleBtn').addEventListener('click', openSettleModal);
    document.getElementById('resetDataBtn').addEventListener('click', ()=>{
      document.getElementById('resetModalBg').classList.add('open');
    });

    const nameInput = document.getElementById('childNameInput');
    nameInput.value = childName;
    nameInput.addEventListener('change', async ()=>{
      childName = nameInput.value.trim();
      await saveData('childName', childName);
      renderHolderName();
    });
    renderHolderName();

    renderChoreGrid();
    renderLedger();
    renderItems();
    renderHistory();
    updateTotalDisplays();
  }

  // ---------------- Record tab ----------------
  function renderChoreGrid(){
    const grid = document.getElementById('choreGrid');
    if(chores.length===0){
      grid.innerHTML = `<div class="empty-note">こうもくがありません。「こうもく」タブでついかしてください。</div>`;
      return;
    }
    grid.innerHTML = chores.map(c=>`
      <button class="chore-btn" data-id="${c.id}">
        <span class="cname">${escapeHtml(c.name)}</span>
        <span class="cprice num">${c.price}</span>
      </button>
    `).join('');
    grid.querySelectorAll('.chore-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> logChore(btn.dataset.id, btn));
    });
  }

  async function logChore(choreId, btnEl){
    const chore = chores.find(c=>c.id===choreId);
    if(!chore) return;
    const date = document.getElementById('entryDate').value || todayStr();
    entries.push({id:uid(), choreId:chore.id, choreName:chore.name, price:chore.price, date});
    await saveData('entries', entries);
    renderLedger();
    updateTotalDisplays();
    playStamp();
    showToast(`「${chore.name}」を記録しました（+¥${chore.price}）`);
  }

  function renderLedger(){
    const ledger = document.getElementById('ledgerList');
    if(entries.length===0){
      ledger.innerHTML = `<div class="ledger-empty">まだ記録がありません。上のボタンからおてつだいを記録しましょう。</div>`;
      return;
    }
    const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date) || 0);
    ledger.innerHTML = sorted.map(e=>`
      <div class="ledger-row" data-id="${e.id}">
        <span class="lr-date">${fmtDateShort(e.date)}</span>
        <span class="lr-name">${escapeHtml(e.choreName)}</span>
        <span class="lr-amt num">${e.price}</span>
        <button class="lr-del" data-id="${e.id}" title="取り消す">×</button>
      </div>
    `).join('');
    ledger.querySelectorAll('.lr-del').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        entries = entries.filter(e=> e.id !== btn.dataset.id);
        await saveData('entries', entries);
        renderLedger();
        updateTotalDisplays();
      });
    });
  }

  function currentTotal(){
    return entries.reduce((sum,e)=> sum + e.price, 0);
  }
  function updateTotalDisplays(){
    const t = currentTotal();
    const g = document.getElementById('graphTotal');
    if(g) g.textContent = t.toLocaleString('ja-JP');
    const settleBtn = document.getElementById('settleBtn');
    if(settleBtn) settleBtn.disabled = t===0;
  }

  // ---------------- Stamp fx ----------------
  function playStamp(){
    const el = document.getElementById('stampFx');
    el.classList.remove('play');
    void el.offsetWidth;
    el.classList.add('play');
  }

  // ---------------- Toast ----------------
  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  // ---------------- Graph tab ----------------
  function drawChart(){
    const canvas = document.getElementById('chart');
    if(!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.parentElement.clientWidth - 32; // account for card padding
    const cssHeight = 200;
    canvas.style.width = cssWidth + 'px';
    canvas.style.height = cssHeight + 'px';
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0,0,cssWidth,cssHeight);

    // Combine full history: money earned each day (from past settlements'
    // entries plus any currently unsettled entries) stays on the graph
    // permanently — settling never erases it. Each settlement additionally
    // shows as a negative (blue) bar on the day it was paid out.
    const earnMap = {};
    const payMap = {};
    settlements.forEach(s=>{
      s.entries.forEach(e=>{
        earnMap[e.date] = (earnMap[e.date]||0) + e.price;
      });
      payMap[s.date] = (payMap[s.date]||0) + s.paid;
    });
    entries.forEach(e=>{
      earnMap[e.date] = (earnMap[e.date]||0) + e.price;
    });

    let days = Array.from(new Set([...Object.keys(earnMap), ...Object.keys(payMap)])).sort();
    if(days.length===0){
      ctx.fillStyle = getCss('--ink-soft');
      ctx.font = "13px 'Noto Sans JP', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('記録がたまるとグラフが表示されます', cssWidth/2, cssHeight/2);
      return;
    }
    if(days.length > 12) days = days.slice(days.length-12);

    const maxMag = Math.max(1, ...days.map(d=> Math.max(earnMap[d]||0, payMap[d]||0)));
    const padLeft = 34, padBottom = 22, padTop = 16, padRight = 8;
    const plotW = cssWidth - padLeft - padRight;
    const plotH = cssHeight - padTop - padBottom;
    const zeroY = padTop + plotH/2;
    const halfH = plotH/2 - 16; // leave room for value labels
    const barGap = 10;
    const barW = Math.max(14, (plotW - barGap*(days.length-1)) / days.length);

    // zero axis line
    ctx.strokeStyle = getCss('--paper-line');
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, zeroY);
    ctx.lineTo(padLeft+plotW, zeroY);
    ctx.stroke();

    days.forEach((d,i)=>{
      const earnV = earnMap[d]||0;
      const payV = payMap[d]||0;
      const x = padLeft + i*(barW+barGap);

      if(earnV>0){
        const h = (earnV/maxMag) * halfH;
        const y = zeroY - h;
        const grad = ctx.createLinearGradient(0,y,0,zeroY);
        grad.addColorStop(0, getCss('--hanko'));
        grad.addColorStop(1, getCss('--gold'));
        ctx.fillStyle = grad;
        roundRect(ctx, x, y, barW, h, 4);
        ctx.fill();

        ctx.fillStyle = getCss('--ink');
        ctx.font = "700 11px 'JetBrains Mono', monospace";
        ctx.textAlign = 'center';
        ctx.fillText('+'+earnV, x+barW/2, y-6);
      }

      if(payV>0){
        const h = (payV/maxMag) * halfH;
        const y = zeroY;
        const grad = ctx.createLinearGradient(0,y,0,y+h);
        grad.addColorStop(0, getCss('--blue'));
        grad.addColorStop(1, getCss('--blue-light'));
        ctx.fillStyle = grad;
        roundRect(ctx, x, y, barW, h, 4);
        ctx.fill();

        ctx.fillStyle = getCss('--blue');
        ctx.font = "700 11px 'JetBrains Mono', monospace";
        ctx.textAlign = 'center';
        ctx.fillText('-'+payV, x+barW/2, y+h+15);
      }

      ctx.fillStyle = getCss('--ink-soft');
      ctx.font = "10px 'Noto Sans JP', sans-serif";
      ctx.fillText(fmtDateShort(d), x+barW/2, padTop+plotH+18);
    });
  }
  function roundRect(ctx,x,y,w,h,r){
    if(h<=0) h=0.0001;
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }
  window.addEventListener('resize', ()=>{
    const graphPanel = document.getElementById('panel-graph');
    if(graphPanel && graphPanel.classList.contains('active')) drawChart();
  });

  // ---------------- Settle ----------------
  function openSettleModal(){
    const total = currentTotal();
    if(total===0) return;
    document.getElementById('settleModalTotal').textContent = total.toLocaleString('ja-JP');
    const input = document.getElementById('settleAmountInput');
    input.value = total;
    input.max = total;
    input.min = 1;
    input.classList.remove('input-error');
    validateSettleAmount();
    document.getElementById('settleModalBg').classList.add('open');
    setTimeout(()=>{ input.focus(); input.select(); }, 50);
  }
  // Returns {valid, amount, remain, message} — never clamps silently;
  // out-of-range values are rejected with a clear message instead.
  function validateSettleAmount(){
    const total = currentTotal();
    const input = document.getElementById('settleAmountInput');
    const note = document.getElementById('settleRemainNote');
    const confirmBtn = document.getElementById('settleConfirm');
    const raw = input.value;
    const val = parseInt(raw);

    let valid = true;
    let message = '';

    if(raw === '' || isNaN(val)){
      valid = false;
      message = '金額を入力してください';
    } else if(val <= 0){
      valid = false;
      message = '0円ではせいさんできません';
    } else if(val > total){
      valid = false;
      message = `たまっている金額（¥${total.toLocaleString('ja-JP')}）より多くはせいさんできません`;
    }

    input.classList.toggle('input-error', !valid);
    input.closest('.settle-input-row').classList.toggle('input-error', !valid);
    confirmBtn.disabled = !valid;

    if(!valid){
      note.textContent = message;
      note.classList.add('is-error');
    } else {
      const remain = total - val;
      note.textContent = remain > 0
        ? `のこり ¥${remain.toLocaleString('ja-JP')} は次回にくり越されます`
        : '';
      note.classList.remove('is-error');
    }

    return {valid, amount: val, remain: total - val, message};
  }
  document.getElementById('settleAmountInput').addEventListener('input', validateSettleAmount);
  document.getElementById('settleCancel').addEventListener('click', ()=>{
    document.getElementById('settleModalBg').classList.remove('open');
  });
  document.getElementById('settleConfirm').addEventListener('click', async ()=>{
    const total = currentTotal();
    if(total===0){
      document.getElementById('settleModalBg').classList.remove('open');
      return;
    }
    const check = validateSettleAmount();
    if(!check.valid){
      showToast(check.message);
      return;
    }
    const paid = check.amount;
    const remain = check.remain;

    const settlement = {
      id: uid(),
      date: todayStr(),
      paid,
      earned: total,
      carried: remain,
      entries: entries.map(e=>({choreName:e.choreName, price:e.price, date:e.date}))
    };
    settlements.unshift(settlement);

    entries = remain > 0
      ? [{id:uid(), choreId:null, choreName:'繰越（前回の残り）', price:remain, date:todayStr()}]
      : [];

    await saveData('settlements', settlements);
    await saveData('entries', entries);
    document.getElementById('settleModalBg').classList.remove('open');
    renderLedger();
    renderHistory();
    updateTotalDisplays();
    drawChart();
    showToast(remain > 0
      ? `¥${paid.toLocaleString('ja-JP')} をせいさんしました（のこり¥${remain.toLocaleString('ja-JP')}）`
      : `¥${paid.toLocaleString('ja-JP')} をせいさんしました`);
  });

  // ---------------- Reset data ----------------
  document.getElementById('resetCancel').addEventListener('click', ()=>{
    document.getElementById('resetModalBg').classList.remove('open');
  });
  document.getElementById('resetConfirm').addEventListener('click', async ()=>{
    entries = [];
    settlements = [];
    await saveData('entries', entries);
    await saveData('settlements', settlements);
    document.getElementById('resetModalBg').classList.remove('open');
    renderLedger();
    renderHistory();
    updateTotalDisplays();
    drawChart();
    showToast('きろくとせいさん履歴を削除しました');
  });

  // ---------------- Items tab ----------------
  function renderItems(){
    const list = document.getElementById('itemsList');
    if(chores.length===0){
      list.innerHTML = `<div class="empty-note">こうもくがありません。下のボタンからついかしてください。</div>`;
      return;
    }
    list.innerHTML = chores.map(c=>`
      <div class="item-row" data-id="${c.id}">
        <input type="text" class="item-name" value="${escapeAttr(c.name)}" placeholder="おてつだいの名前">
        <span class="yen-sign">¥</span>
        <input type="number" class="item-price" value="${c.price}" min="0" step="10">
        <button class="del-item" title="削除">×</button>
      </div>
    `).join('');
    list.querySelectorAll('.item-row').forEach(row=>{
      const id = row.dataset.id;
      const nameInput = row.querySelector('.item-name');
      const priceInput = row.querySelector('.item-price');
      const delBtn = row.querySelector('.del-item');
      nameInput.addEventListener('change', ()=> updateItem(id, {name: nameInput.value.trim() || '無題'}));
      priceInput.addEventListener('change', ()=> updateItem(id, {price: Math.max(0, parseInt(priceInput.value)||0)}));
      delBtn.addEventListener('click', ()=> deleteItem(id));
    });
  }
  async function updateItem(id, patch){
    const c = chores.find(c=>c.id===id);
    if(!c) return;
    Object.assign(c, patch);
    await saveData('chores', chores);
    renderChoreGrid();
  }
  async function deleteItem(id){
    chores = chores.filter(c=> c.id !== id);
    await saveData('chores', chores);
    renderItems();
    renderChoreGrid();
  }
  async function addNewItemRow(){
    const c = {id:uid(), name:'あたらしいおてつだい', price:100};
    chores.push(c);
    await saveData('chores', chores);
    renderItems();
    renderChoreGrid();
    const rows = document.querySelectorAll('.item-row');
    const last = rows[rows.length-1];
    if(last){
      const inp = last.querySelector('.item-name');
      inp.focus();
      inp.select();
    }
  }

  // ---------------- History tab ----------------
  function renderHistory(){
    const list = document.getElementById('historyList');
    if(settlements.length===0){
      list.innerHTML = `<div class="empty-note">せいさん履歴はまだありません。</div>`;
      return;
    }
    list.innerHTML = settlements.map(s=>`
      <div class="hist-item" data-id="${s.id}">
        <div class="hist-head">
          <span class="hd-date">${fmtDateFull(s.date)}</span>
          <span class="hd-amt num">${s.paid.toLocaleString('ja-JP')}</span>
        </div>
        <div class="hist-body">
          ${s.carried > 0 ? `<div class="hb-carry">くり越し ¥${s.carried.toLocaleString('ja-JP')}（この時の合計 ¥${s.earned.toLocaleString('ja-JP')}）</div>` : ''}
          ${s.entries.map(e=>`
            <div class="hb-row">
              <span>${fmtDateShort(e.date)}　${escapeHtml(e.choreName)}</span>
              <span class="num">¥${e.price}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.hist-head').forEach(head=>{
      head.addEventListener('click', ()=>{
        head.nextElementSibling.classList.toggle('open');
      });
    });
  }

  // ---------------- Utils ----------------
  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
  function escapeAttr(str){
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  init();
})();
</script>
</body>
</html>
